services:
  - type: web
    name: atlas-ai
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: RENDER
        value: "true"
      - key: LLM_BASE_URL
        value: "https://api.groq.com/openai/v1"
      - key: LLM_MODEL
        value: "llama-3.3-70b-versatile"
      - key: LLM_API_KEY
        sync: false          # set this in the Render dashboard, don't commit it
      - key: ADMIN_TOKEN
        sync: false          # set this too -- required for the /admin upload page to work
    disk:
      name: chroma-storage
      mountPath: /opt/render/project/data
      sizeGB: 1
